name: Update latest package metadata

on:
  schedule:
    # GitHub Actions supports a minimum schedule interval of five minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-package-metadata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build latest package manifest
        shell: bash
        run: |
          set -euo pipefail

          output="aeudev/recipes/latest.json"
          tmp="$(mktemp)"
          mkdir -p "$(dirname "${output}")"

          gh api --paginate \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            repos/PeterSuh-Q3/mshell-manager/releases \
            --jq '[.[] | select(.draft == false and .prerelease == false)] | sort_by(.published_at) | last' \
            > /tmp/mshell-release.json
          gh api --paginate \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            repos/PeterSuh-Q3/SynoSmartInfo/releases \
            --jq '[.[] | select(.draft == false and .prerelease == false)] | sort_by(.published_at) | last' \
            > /tmp/synosmartinfo-release.json
          gh api --paginate \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            repos/PeterSuh-Q3/syno-amdgpu-driver/releases \
            --jq '[.[] | select(.draft == false and .prerelease == false)] | sort_by(.published_at) | last' \
            > /tmp/amdgpu-release.json

          jq -n \
            --slurpfile manager /tmp/mshell-release.json \
            --slurpfile smart /tmp/synosmartinfo-release.json \
            --slurpfile amdgpu /tmp/amdgpu-release.json \
            '
            def release($r; $asset_filter):
              ($r[0]) as $x |
              {
                repository: $x.html_url | sub("/releases/.*$"; "") | sub("https://github.com/"; ""),
                tag: $x.tag_name,
                published_at: $x.published_at,
                assets: [$x.assets[] | select(.name | test($asset_filter)) | {
                  name, size, sha256: (.digest // "" | sub("^sha256:"; "")), url: .browser_download_url
                }]
              };
            {
              schema: 1,
              packages: {
                mshell_manager: release($manager; "\\.spk$") ,
                syno_smart_info: release($smart; "\\.spk$"),
                amd_gpu_runtime: release($amdgpu; "\\.spk$")
              }
            }' | jq -S '.' > "${tmp}"

          if [ -f "${output}" ] && cmp -s "${tmp}" "${output}"; then
            echo "No package metadata changes."
            exit 0
          fi

          mv "${tmp}" "${output}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${output}"
          git commit -m 'chore: refresh latest package metadata'
          git push
