name: Update latest package metadata

on:
  workflow_dispatch:
  schedule:
    # Check the public package release repositories every 15 minutes.
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: update-latest-package-metadata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build latest package manifest
        shell: bash
        run: |
          set -euo pipefail

          output="aeudev/recipes/latest.json"
          tmp="$(mktemp)"
          mkdir -p "$(dirname "${output}")"

          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/PeterSuh-Q3/mshell-manager-rel/releases/latest' \
            > /tmp/mshell-release.json
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/PeterSuh-Q3/SynoSmartInfo/releases/latest' \
            > /tmp/synosmartinfo-release.json
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/PeterSuh-Q3/syno-amdgpu-driver/releases/latest' \
            > /tmp/amdgpu-release.json
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/PeterSuh-Q3/syno-amdgpu-top/releases/latest' \
            > /tmp/amdgpu-top-release.json
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/PeterSuh-Q3/syno-intel-gpu-top/releases/latest' \
            > /tmp/intel-gpu-top-release.json

          jq -n \
            --slurpfile manager /tmp/mshell-release.json \
            --slurpfile smart /tmp/synosmartinfo-release.json \
            --slurpfile amdgpu /tmp/amdgpu-release.json \
            --slurpfile amdgpu_top /tmp/amdgpu-top-release.json \
            --slurpfile intel_gpu_top /tmp/intel-gpu-top-release.json \
            '
            def release($r; $asset_filter):
              ($r[0]) as $x |
              {
                repository: $x.html_url | sub("/releases/.*$"; "") | sub("https://github.com/"; ""),
                tag: $x.tag_name,
                published_at: $x.published_at,
                assets: [$x.assets[] | select(.name | test($asset_filter)) | {
                  name, size, sha256: (.digest // "" | sub("^sha256:"; "")), url: .browser_download_url
                }]
              };
            {
              schema: 1,
              packages: {
                mshell_manager: release($manager; "\\.spk$") ,
                syno_smart_info: release($smart; "\\.spk$"),
                amd_gpu_runtime: release($amdgpu; "\\.spk$"),
                amdgpu_top: release($amdgpu_top; "\\.spk$"),
                intel_gpu_top: release($intel_gpu_top; "\\.spk$")
              }
            }' | jq -S '.' > "${tmp}"

          # universal.json carries the checksum used by the aeudev extension
          # downloader. Keep it synchronized whenever latest.json changes.
          manifest_sha256="$(sha256sum "${tmp}" | awk '{print $1}')"
          universal_tmp="$(mktemp)"
          jq --arg hash "${manifest_sha256}" '
            .files |= map(
              if .name == "latest.json" then .sha256 = $hash else . end
            )
          ' aeudev/recipes/universal.json > "${universal_tmp}"
          mv "${universal_tmp}" aeudev/recipes/universal.json

          if cmp -s "${tmp}" "${output}" && git diff --quiet -- aeudev/recipes/universal.json; then
            echo "No package metadata or checksum changes."
            exit 0
          fi

          mv "${tmp}" "${output}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # universal.json was already rewritten above to match this run's
          # latest.json checksum - it MUST be added here too, or the sync
          # logic above computes a value that's silently discarded when the
          # runner's workspace is torn down (confirmed live: this exact gap
          # caused a real checksum-mismatch failure on real hardware, since
          # universal.json's pinned sha256 hadn't moved since 2026-08-24
          # while latest.json kept getting refreshed every 15 minutes).
          git add "${output}" aeudev/recipes/universal.json
          git commit -m 'chore: refresh latest package metadata'
          git push
