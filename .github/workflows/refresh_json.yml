name: Update SHA256 from Latest Release

on:
  # 수동 실행
  workflow_dispatch:
    inputs:
      release_tag:
        description: '갱신할 릴리즈 태그 (비워두면 latest 사용)'
        required: false
        default: ''
      release_body:
        description: 'Release note (커밋 메시지 본문에 기록)'
        required: false
        default: ''

permissions:
  contents: write  # JSON 파일 커밋을 위해 필요

jobs:
  update-sha256:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------ #
      # 1. 소스 체크아웃
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------ #
      # 2. 대상 릴리즈 태그 결정
      #    - release 이벤트 → github.event.release.tag_name
      #    - workflow_dispatch + 태그 입력 → inputs.release_tag
      #    - workflow_dispatch + 태그 미입력 → GitHub API로 latest 조회
      # ------------------------------------------------------------------ #
      - name: Determine target release tag
        id: get_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q '.tagName')
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "대상 릴리즈 태그: ${TAG}"

      # ------------------------------------------------------------------ #
      # 3. files-chksum을 실제 같은 릴리즈의 .tgz asset digest와 대조하여
      #    일치하는 항목만 sha256 맵에 등록
      #    files-chksum 형식 (공백 구분 3열):
      #      <sha256hex>  <파일명>  <체크섬파일명>
      #    예:
      #      8a7d9870...  apollolake-7.2-4.4.302.tgz  modpack.sha256
      #      9cbf4506...  firmware.tgz                 firmware.sha256
      #
      #    GitHub Releases API가 반환하는 asset digest(sha256)를 실제 자산 해시로
      #    사용한다. 불일치하거나 자산/digest가 없으면 경고하고 맵에서 제외한다.
      # ------------------------------------------------------------------ #
      - name: Parse files-chksum and build SHA256 map
        id: sha256_map
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          WORK_DIR="$(mktemp -d)"
          CHKSUM_FILE="${WORK_DIR}/files-chksum"
          SHA256_MAP="${WORK_DIR}/sha256_map.json"
          ASSET_MAP="${WORK_DIR}/release_asset_sha256.json"
          RELEASE_JSON="${WORK_DIR}/release.json"

          echo "{}" > "${SHA256_MAP}"

          echo "=== files-chksum 다운로드: ${TAG} ==="
          gh release download "${TAG}" \
            --repo "${REPO}" \
            --pattern "files-chksum" \
            --dir "${WORK_DIR}" \
            --clobber

          echo "=== 같은 릴리즈의 실제 자산 SHA-256 조회 ==="
          gh api "repos/${REPO}/releases/tags/${TAG}" > "${RELEASE_JSON}"
          jq '
            [.assets[]
              | select(.name | endswith(".tgz"))
              | {key: .name, value: ((.digest // "") | sub("^sha256:"; "") | ascii_downcase)}]
            | from_entries
          ' "${RELEASE_JSON}" > "${ASSET_MAP}"

          echo "=== files-chksum 내용 ==="
          cat "${CHKSUM_FILE}"
          echo ""

          echo "=== 플랫폼 tgz 행 검증 및 파싱 ==="
          # 패턴: {플랫폼}-{DSM버전}-{커널버전}.tgz 행만 추출 (-drm 접미사 포함)
          # 예: apollolake-7.2-4.4.302.tgz  /  apollolake-7.4-4.4.302-drm.tgz
          # 제외: firmware.tgz, firmwarei915.tgz 등 (플랫폼-X.Y- 패턴이 아닌 것)
          verified_count=0
          mismatch_count=0
          while IFS=' ' read -r SHA256 FILENAME _REST; do
            [ -z "${SHA256}" ] || [ -z "${FILENAME}" ] && continue

            if ! echo "${FILENAME}" | grep -qE '^[a-z0-9]+-[0-9]+\.[0-9]+-[0-9]+.*(-drm)?\.tgz$'; then
              echo "  건너뜀: ${FILENAME}"
              continue
            fi

            expected_sha="$(printf '%s' "${SHA256}" | tr '[:upper:]' '[:lower:]')"
            actual_sha="$(jq -r --arg name "${FILENAME}" '.[$name] // empty' "${ASSET_MAP}")"
            if ! printf '%s' "${expected_sha}" | grep -qE '^[0-9a-f]{64}$'; then
              echo "::warning::잘못된 SHA-256 형식으로 건너뜀: ${FILENAME} (${SHA256})"
              mismatch_count=$((mismatch_count + 1))
              continue
            fi
            if [ -z "${actual_sha}" ]; then
              echo "::warning::릴리즈 자산 또는 SHA-256 digest가 없어 건너뜀: ${FILENAME}"
              mismatch_count=$((mismatch_count + 1))
              continue
            fi
            if [ "${expected_sha}" != "${actual_sha}" ]; then
              echo "::warning::SHA-256 불일치로 건너뜀: ${FILENAME} (files-chksum=${expected_sha}, release asset=${actual_sha})"
              mismatch_count=$((mismatch_count + 1))
              continue
            fi

            echo "  검증 통과: ${FILENAME} → ${actual_sha}"

            SHA256_MAP_TMP=$(jq \
              --arg name "${FILENAME}" \
              --arg hash "${actual_sha}" \
              '. + {($name): $hash}' \
              "${SHA256_MAP}")
            echo "${SHA256_MAP_TMP}" > "${SHA256_MAP}"
            verified_count=$((verified_count + 1))
          done < "${CHKSUM_FILE}"

          echo "검증 결과: 통과 ${verified_count}건, 불일치/누락 ${mismatch_count}건"
          {
            echo "### files-chksum SHA-256 validation"
            echo "- Release: \`${REPO}@${TAG}\`"
            echo "- Verified entries applied: ${verified_count}"
            echo "- Mismatched or missing entries skipped: ${mismatch_count}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "sha256_map_file=${SHA256_MAP}" >> "$GITHUB_OUTPUT"
          echo "verified_count=${verified_count}" >> "$GITHUB_OUTPUT"
          echo "mismatch_count=${mismatch_count}" >> "$GITHUB_OUTPUT"
          echo ""
          echo "=== 최종 SHA256 맵 ==="
          cat "${SHA256_MAP}"

      # ------------------------------------------------------------------ #
      # 4. 갱신 대상 JSON 파일을 backup_json.zip 으로 백업
      # ------------------------------------------------------------------ #
      - name: Backup JSON files
        run: |
          set -euo pipefail

          # {platform}-{dsm_ver}.json 패턴 파일만 zip 으로 묶음
          # (all-modules, anodrm-modules 공통)
          BACKUP_LIST=()
          for JSON_FILE in ./all-modules/releases/*.json ./anodrm-modules/releases/*.json; do
            [ -f "${JSON_FILE}" ] || continue
            BASENAME=$(basename "${JSON_FILE}")
            if echo "${BASENAME}" | grep -qE '^[a-z0-9]+-[0-9]+\.[0-9]+\.json$'; then
              BACKUP_LIST+=("${JSON_FILE}")
            fi
          done

          if [ ${#BACKUP_LIST[@]} -eq 0 ]; then
            echo "::warning::백업할 JSON 파일이 없습니다."
            exit 0
          fi

          zip backup_json.zip "${BACKUP_LIST[@]}"
          echo "백업 완료: backup_json.zip (${#BACKUP_LIST[@]}개 파일)"
          zipinfo -1 backup_json.zip

      # ------------------------------------------------------------------ #
      # 5. JSON 파일의 sha256 값 갱신
      #    - 워크스페이스 루트의 {platform}-{dsm_ver}.json 파일을 스캔
      #    - files[] 중 name이 sha256_map 에 있는 .tgz 항목만 갱신
      # ------------------------------------------------------------------ #
      - name: Update sha256 in JSON files
        id: update_json
        env:
          SHA256_MAP_FILE: ${{ steps.sha256_map.outputs.sha256_map_file }}
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          set -euo pipefail

          CHANGED_FILES=()

          # all-modules/releases/ 와 anodrm-modules/releases/ 의
          # {platform}-{dsm_ver}.json 파일 순회
          # 예: apollolake-7.2.json, broadwellnk-7.1.json, ...
          for JSON_FILE in ./all-modules/releases/*.json ./anodrm-modules/releases/*.json; do
            [ -f "${JSON_FILE}" ] || continue
            BASENAME=$(basename "${JSON_FILE}")
            # platform-X.Y.json 패턴인지 확인 (rpext-index.json 등 제외)
            if ! echo "${BASENAME}" | grep -qE '^[a-z0-9]+-[0-9]+\.[0-9]+\.json$'; then
              echo "건너뜀 (패턴 불일치): ${JSON_FILE}"
              continue
            fi

            # files[] 배열에서 name이 .tgz 로 끝나고 sha256_map에 있는 항목만 갱신
            # . as $file 로 요소를 캡처해 has() 에 명시적 문자열 키를 전달,
            # null name 으로 인한 "Cannot check whether object has a null key" 오류 방지
            UPDATED=$(jq \
              --slurpfile sha_map "${SHA256_MAP_FILE}" \
              --arg release_tag "${TAG}" \
              '
              .files |= map(
                . as $file
                | if (
                    ($file.name | type == "string")
                    and ($file.name | test("\\.tgz$"))
                    and (($sha_map[0] | type == "object") and ($sha_map[0] | has($file.name)))
                  )
                  then
                    $file
                    | .sha256 = $sha_map[0][$file.name]
                    | .url = (
                        "https://github.com/${{ github.repository }}/releases/download/"
                        + $release_tag + "/" + $file.name
                      )
                  else
                    $file
                  end
              )
              ' "${JSON_FILE}")

            # 변경이 있을 때만 파일 덮어쓰기
            CURRENT=$(cat "${JSON_FILE}")
            if [ "${CURRENT}" != "${UPDATED}" ]; then
              echo "${UPDATED}" | jq '.' > "${JSON_FILE}"
              echo "  업데이트됨: ${JSON_FILE}"
              CHANGED_FILES+=("${JSON_FILE}")
            else
              echo "  변경 없음: ${JSON_FILE}"
            fi
          done

          if [ ${#CHANGED_FILES[@]} -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "changed_list=" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # 공백 구분 리스트
            echo "changed_list=${CHANGED_FILES[*]}" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------------ #
      # 5. 변경된 JSON 파일 커밋 & 푸시
      # ------------------------------------------------------------------ #
      - name: Commit and push updated JSON files
        if: steps.update_json.outputs.changed == 'true'
        env:
          TAG: ${{ steps.get_tag.outputs.tag }}
          BODY: ${{ inputs.release_body }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 변경된 JSON 파일 및 백업 zip 스테이징
          for F in ${{ steps.update_json.outputs.changed_list }}; do
            git add "${F}"
          done
          git add backup_json.zip

          git commit -m "chore: update sha256 for release ${TAG}

          Updated files:
          ${{ steps.update_json.outputs.changed_list }}

          Source: https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          # 릴리즈노트(입력값)가 있으면 별도 커밋 본문으로 추가
          if [ -n "$BODY" ]; then
            git commit --allow-empty -m "release note: ${TAG}" -m "$BODY"
          fi

          git push

      # ------------------------------------------------------------------ #
      # 6. 변경 없으면 알림
      # ------------------------------------------------------------------ #
      - name: No changes detected
        if: steps.update_json.outputs.changed == 'false'
        run: |
          if [ "${{ steps.sha256_map.outputs.mismatch_count }}" -gt 0 ]; then
            echo "변경된 JSON은 없습니다. 실제 자산 해시와 불일치하거나 검증할 수 없는 ${{ steps.sha256_map.outputs.mismatch_count }}개 항목은 건너뛰었습니다. 검증 요약을 확인하세요."
          else
            echo "모든 JSON 파일의 sha256 값이 실제 릴리즈 자산과 일치하며 이미 최신 상태입니다."
          fi
         
